apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: domainbot
  labels: { app: domainbot, component: prometheus }
spec:
  replicas: 1
  selector:
    matchLabels: { app: domainbot, component: prometheus }
  template:
    metadata:
      labels: { app: domainbot, component: prometheus }
    spec:
      serviceAccountName: prometheus       # needs RBAC to discover pods
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args: ["--config.file=/etc/prometheus/prometheus.yml"]
          ports: [{ containerPort: 9090 }]
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: domainbot
spec:
  selector: { app: domainbot, component: prometheus }
  ports: [{ port: 9090, targetPort: 9090 }]
