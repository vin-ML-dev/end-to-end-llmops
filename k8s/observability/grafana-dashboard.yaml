# Grafana dashboard: the four golden signals + cache hit ratio + canary compare.
# Panels use 'variant' label to compare stable vs canary side by side.
apiVersion: v1
data:
  domainbot.json: "{\n  \"annotations\": {\n    \"list\": []\n  },\n  \"editable\": true,\n  \"graphTooltip\": 0,\n  \"panels\": [\n    {\n      \"id\": 1,\n      \"title\": \"Request Rate (req/s)\",\n      \"type\": \"timeseries\",\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 0\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"reqps\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum(rate(domainbot_requests_total[1m])) by (variant)\",\n          \"legendFormat\": \"{{variant}}\",\n          \"refId\": \"A\"\n        }\n      ]\n    },\n    {\n      \"id\": 2,\n      \"title\": \"Latency p50 / p95 / p99 (s)\",\n      \"type\": \"timeseries\",\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 0\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"s\"\n        },\n      \
    \  \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"expr\": \"histogram_quantile(0.95, sum(rate(domainbot_request_duration_seconds_bucket[5m])) by (le, variant))\",\n          \"legendFormat\": \"{{variant}}\",\n          \"refId\": \"A\"\n        }\n      ]\n    },\n    {\n      \"id\": 3,\n      \"title\": \"Error Rate by Status (req/s)\",\n      \"type\": \"timeseries\",\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 8\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"reqps\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum(rate(domainbot_requests_total{status=~\\\"4..|5..\\\"}[1m])) by (status)\",\n          \"legendFormat\": \"{{status}}\",\n          \"refId\": \"A\"\n        }\n      ]\n    },\n    {\n      \"id\": 4,\n      \"title\": \"Cache Hit Ratio\",\n      \"type\": \"timeseries\",\n      \"gridPos\": {\n\
    \        \"h\": 8,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 8\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percentunit\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum(rate(domainbot_cache_events_total{result=\\\"hit\\\"}[5m])) / sum(rate(domainbot_cache_events_total[5m]))\",\n          \"legendFormat\": \"hit ratio\",\n          \"refId\": \"A\"\n        }\n      ]\n    },\n    {\n      \"id\": 5,\n      \"title\": \"Rate-Limited (429/s)\",\n      \"type\": \"timeseries\",\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 16\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"reqps\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum(rate(domainbot_rate_limited_total[1m]))\",\n          \"legendFormat\": \"429s\",\n          \"refId\"\
    : \"A\"\n        }\n      ]\n    },\n    {\n      \"id\": 6,\n      \"title\": \"Tokens/s by Variant\",\n      \"type\": \"timeseries\",\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 16\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum(rate(domainbot_tokens_total[1m])) by (variant, kind)\",\n          \"legendFormat\": \"{{variant}} {{kind}}\",\n          \"refId\": \"A\"\n        }\n      ]\n    },\n    {\n      \"id\": 7,\n      \"title\": \"Upstream Up (1=healthy)\",\n      \"type\": \"timeseries\",\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 24\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"expr\"\
    : \"domainbot_upstream_up\",\n          \"legendFormat\": \"upstream\",\n          \"refId\": \"A\"\n        }\n      ]\n    },\n    {\n      \"id\": 8,\n      \"title\": \"Upstream Errors/s by Kind\",\n      \"type\": \"timeseries\",\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 24\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"reqps\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"expr\": \"sum(rate(domainbot_upstream_errors_total[1m])) by (kind)\",\n          \"legendFormat\": \"{{kind}}\",\n          \"refId\": \"A\"\n        }\n      ]\n    }\n  ],\n  \"schemaVersion\": 39,\n  \"tags\": [\n    \"domainbot\"\n  ],\n  \"time\": {\n    \"from\": \"now-15m\",\n    \"to\": \"now\"\n  },\n  \"refresh\": \"10s\",\n  \"title\": \"DomainBot Gateway \\u2014 Observability\",\n  \"uid\": \"domainbot-gateway\",\n  \"version\": 1\n}"
