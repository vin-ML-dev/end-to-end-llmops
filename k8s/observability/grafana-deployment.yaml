# Grafana — dashboards on top of Prometheus. Ships with the Prometheus datasource
# and the DomainBot dashboard pre-provisioned, so it works the moment it starts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: domainbot
  labels: { app: domainbot, component: grafana }
spec:
  replicas: 1
  selector:
    matchLabels: { app: domainbot, component: grafana }
  template:
    metadata:
      labels: { app: domainbot, component: grafana }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          env:
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: "Admin" }
            - { name: GF_SECURITY_ADMIN_PASSWORD, value: "admin" }
          ports: [{ containerPort: 3000 }]
          volumeMounts:
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources }
            - { name: dashboards-provider, mountPath: /etc/grafana/provisioning/dashboards }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
      volumes:
        - name: datasources
          configMap: { name: grafana-datasources }
        - name: dashboards-provider
          configMap: { name: grafana-dashboards-provider }
        - name: dashboards
          configMap: { name: grafana-dashboards }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: domainbot
spec:
  selector: { app: domainbot, component: grafana }
  ports: [{ port: 3000, targetPort: 3000 }]
