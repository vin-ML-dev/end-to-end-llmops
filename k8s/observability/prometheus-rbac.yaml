# Prometheus needs permission to discover pods for scraping.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: domainbot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-domainbot
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-domainbot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-domainbot
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: domainbot
