# TEMPLATE ONLY — real values set via `kubectl create secret` (see COMMANDS).
# In this architecture the external model endpoint URL lives here (it may embed
# a token). NEVER commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: domainbot-secrets
  namespace: domainbot
type: Opaque
stringData:
  # the EXTERNAL cloud model endpoint (OpenAI-compatible /v1). Example shapes:
  #   https://<pod-id>-8000.proxy.runpod.net/v1
  #   https://api.together.xyz/v1
  #   https://your-endpoint.modal.run/v1
  DOMAINBOT_ENGINE_URL: "https://REPLACE-ME.example.com/v1"
  # if the external endpoint requires its own auth token (many managed APIs do):
  DOMAINBOT_ENGINE_API_KEY: "changeme-or-empty"
  # the gateway's OWN api key (clients use this to call the gateway):
  DOMAINBOT_API_KEY: "changeme-set-via-kubectl"
