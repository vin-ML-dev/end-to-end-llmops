# Horizontal Pod Autoscaler: automatically scale the GATEWAY replicas up/down
# based on CPU load. Scales the cheap CPU gateway, NOT the GPU engine (you don't
# autoscale GPUs by CPU %, and GPUs are scarce/expensive).
#
# Needs metrics-server installed in the cluster (see COMMANDS-day5.txt).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: domainbot-gateway
  namespace: domainbot
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: domainbot-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70      # add pods when avg CPU > 70% of requests
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120  # wait 2min of low load before scaling down (avoid flapping)
    scaleUp:
      stabilizationWindowSeconds: 15   # scale up fast
