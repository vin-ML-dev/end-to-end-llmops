[project]
name = "domainbot-llmops"
version = "0.1.0"
description = "Production LLMOps platform: fine-tune -> gate -> serve -> deploy -> observe -> retrain"
requires-python = ">=3.10"
dependencies = [
    "datasets>=3.0.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0",
    "pydantic>=2.9.0",
    "dvc>=3.55.0",
    "huggingface_hub>=0.26.0",
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.7.0", "pre-commit>=4.0", "nbstripout>=0.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
