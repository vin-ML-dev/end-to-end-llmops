name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  # ---- 1. lint + test (fast, no Docker) — fail early ----
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          pip install -r requirements-serve.txt
          pip install pytest ruff pyyaml
      - name: lint
        run: ruff check src/ tests/
      - name: test
        run: pytest tests/ -v
      # k8s manifests must be valid too (uses the same test file, no cluster needed)
      - name: validate manifests
        run: pytest tests/test_k8s_manifests.py -v
  # ---- 2. build + push image, tagged by git SHA (only on main, only if tests pass) ----
  build-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: set lowercase image name
        id: image
        run: echo "name=$(echo 'ghcr.io/${{ github.repository_owner }}/domainbot-gateway' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: set up buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
      - name: build + push (sha + latest-main tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          builder: ${{ steps.buildx.outputs.name }}
          provenance: false          # <-- key fix: plain single manifest, no index
          sbom: false                # <-- same reason
          platforms: linux/amd64     # explicit; add arm64 only if you deploy on it
          tags: |
            ${{ steps.image.outputs.name }}:git-${{ github.sha }}
            ${{ steps.image.outputs.name }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
  # ---- 3. update the GitOps manifest to point at the new SHA ----
  # writes the new image tag into k8s/kustomization.yaml and commits it back.
  # Argo CD (watching the repo) then rolls it out — no kubectl from CI (pull-based).
  bump-manifest:
    needs: build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # to commit the manifest bump
    steps:
      - uses: actions/checkout@v4
      - name: set image tag in kustomization
        run: |
          cd k8s
          # pin the deployed image to this exact commit
          sed -i "s|newTag:.*|newTag: \"git-${{ github.sha }}\"|" kustomization.yaml
      - name: commit the bump
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git commit -m "ci: deploy git-${{ github.sha }} [skip ci]" || echo "no change"
          git push
