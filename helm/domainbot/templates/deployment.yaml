apiVersion: apps/v1
kind: Deployment
metadata:
  name: domainbot-gateway
  labels: { app: domainbot, component: gateway }
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app: domainbot, component: gateway }
  template:
    metadata:
      labels: { app: domainbot, component: gateway }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 8000 }]
          env:
            - { name: DOMAINBOT_REVISION, value: "{{ .Values.model.revision }}" }
            - { name: DOMAINBOT_REPO_ID, value: "{{ .Values.model.repoId }}" }
          envFrom:
            - secretRef: { name: {{ .Values.secretName }} }
          resources: {{ toYaml .Values.resources | nindent 12 }}
          livenessProbe:  { httpGet: { path: /healthz, port: 8000 }, initialDelaySeconds: 5, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /readyz,  port: 8000 }, initialDelaySeconds: 5, periodSeconds: 5 }
